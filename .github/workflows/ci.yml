name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  # CloudKit fixes a field's encryption setting the moment the schema is deployed
  # to Production: it can never be flipped afterwards, in either direction. So a
  # change to Sources/CairnCore/Models has to be deployed before it ships, and
  # Config/schema-promotions.txt records that it was. This job fails until the
  # current schema hash appears there, which is what stops a new field or a new
  # encryption attribute from reaching TestFlight undeployed.
  schema-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Proves the extraction is portable (plain POSIX awk) before trusting it.
      - name: Check the schema-hash fixtures
        run: Scripts/tests/schema-hash-test.sh
      - name: Require a recorded CloudKit schema promotion
        run: Scripts/schema-hash.sh --check

  test-and-build:
    # Verify the runner has the iOS 27.1 SDK needed for native iPhone Duo layouts.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: bash Scripts/select-xcode.sh

      - name: Install tooling
        run: brew install xcodegen swiftlint

      - name: Run core tests
        run: swift test

      - name: Generate project
        run: xcodegen generate

      - name: Lint
        run: swiftlint

      - name: Build macOS
        run: |
          xcodebuild -project Cairn.xcodeproj -scheme Cairn \
            -destination 'platform=macOS' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS simulator
        run: |
          xcodebuild -project Cairn.xcodeproj -scheme Cairn \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
