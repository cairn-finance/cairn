name: Cairn
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "27.0"
  developmentLanguage: en
  knownRegions: [en, Base]

packages:
  CairnCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Cairn:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CairnApp
    dependencies:
      - package: CairnCore
        product: CairnCore
    configFiles:
      # Signing settings live in xcconfig so team and bundle id stay out of git.
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Cairn
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Cairn.entitlements
        # FinanceKit is iPhone/iPad only, so the iOS entitlement (which adds the
        # FinanceKit financial-data capability) is selected per SDK; macOS keeps
        # the base file.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Cairn-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Cairn-iOS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CairnApp/Resources/Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM, and CODE_SIGN_STYLE come
        # from Config/Signing.xcconfig (and its optional local override), so
        # they are never hardcoded here or committed.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""

schemes:
  Cairn:
    build:
      targets:
        Cairn: all
    run:
      config: Debug
    archive:
      config: Release